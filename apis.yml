apis:
- aid: snowplow:snowplow-trackers
  name: Snowplow Tracker SDKs
  description: >-
    Snowplow provides tracker SDKs for all major platforms including JavaScript (web), iOS, Android, Python,
    Java, Go, Ruby, .NET, PHP, and Rust. Trackers generate self-describing events and send them to the
    Snowplow Collector. All trackers support self-describing events, contexts, page views, structured
    events, and session tracking.
  humanURL: https://docs.snowplow.io/docs/collecting-data/collecting-from-own-applications
